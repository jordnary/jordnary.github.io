<!doctype html>
<html lang="zh-CN" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="theme-color" content="#020617" />
    <meta name="application-name" content="Jordnary" />
    <meta
      name="description"
      content="Jordnary 的个人主页，展示前端项目、技能栈、成长时间线和联系方式。"
    />
    <meta
      name="keywords"
      content="Jordnary, personal website, React, TypeScript, Tailwind CSS, frontend, portfolio"
    />
    <meta name="author" content="Jordnary" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jordnary.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Jordnary" />
    <meta property="og:title" content="Jordnary | Personal Website" />
    <meta
      property="og:description"
      content="React、TypeScript 和 Tailwind CSS 构建的科技风个人主页。"
    />
    <meta property="og:url" content="https://jordnary.github.io/" />
    <meta property="og:image" content="https://jordnary.github.io/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jordnary personal website preview" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jordnary | Personal Website" />
    <meta
      name="twitter:description"
      content="React、TypeScript 和 Tailwind CSS 构建的科技风个人主页。"
    />
    <meta name="twitter:image" content="https://jordnary.github.io/og-image.png" />
    <meta name="twitter:image:alt" content="Jordnary personal website preview" />
    <title>Jordnary | Personal Website</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Jordnary",
        "url": "https://jordnary.github.io/",
        "sameAs": ["https://github.com/jordnary"],
        "knowsAbout": ["React", "TypeScript", "Tailwind CSS", "Frontend Engineering"]
      }
    </script>
    <script>
      (() => {
        const storageKey = 'jordnary-theme'
        const root = document.documentElement
        const themeColorMeta = document.querySelector('meta[name="theme-color"]')
        const getStoredTheme = () => {
          try {
            const storedTheme = window.localStorage.getItem(storageKey)

            return storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : null
          } catch {
            return null
          }
        }
        const theme =
          getStoredTheme() ??
          (window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark')

        root.dataset.theme = theme
        root.classList.toggle('dark', theme === 'dark')
        root.classList.toggle('light', theme === 'light')
        root.style.colorScheme = theme

        if (themeColorMeta) {
          themeColorMeta.content = theme === 'light' ? '#f8fafc' : '#020617'
        }
      })()
    </script>
  </head>
  <body data-page="home">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
