name: Deploy static content to Pages

on:
  push:
    branches: ['main']

  schedule:
    # 每 6 小时同步 GitHub / RSS 快照、构建、发布并清理历史（UTC）。
    - cron: '17 */6 * * *'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Validate snapshots
        run: npm run test:snapshots

      - name: Validate project document sync and routes
        run: npm run test:project-docs

      - name: Build with authenticated GitHub snapshot sync
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-deployments:
    name: Clean Pages deployment history
    needs: deploy
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Delete old completed deployment workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cleanup-history.mjs

      - name: Delete previous Pages deployments
        if: ${{ needs.deploy.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          deployment_rows="$(
            gh api --method GET --paginate \
              "repos/${REPOSITORY}/deployments?environment=github-pages&per_page=100" \
              --jq '.[] | [.created_at, .id] | @tsv'
          )"

          mapfile -t old_deployments < <(
            printf '%s\n' "${deployment_rows}" |
              sort -r |
              cut -f2 |
              tail -n +2
          )

          if ((${#old_deployments[@]} == 0)); then
            echo "No previous Pages deployments to delete"
          fi

          for deployment_id in "${old_deployments[@]}"; do
            echo "Deleting previous Pages deployment ${deployment_id}"
            gh api --method POST \
              "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" \
              -f state=inactive
            gh api --method DELETE "repos/${REPOSITORY}/deployments/${deployment_id}"
          done
