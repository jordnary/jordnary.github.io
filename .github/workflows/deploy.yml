name: Deploy static content to Pages

on:
  push:
    branches: ['main']

  schedule:
    # 每 6 小时重新拉取 RSS、构建并发布一次（UTC）。
    - cron: '17 */6 * * *'

  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup-deployments:
    name: Keep latest Pages deployment
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Delete previous Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          deployment_rows="$(
            gh api --method GET --paginate \
              "repos/${REPOSITORY}/deployments?environment=github-pages&per_page=100" \
              --jq '.[] | [.created_at, .id] | @tsv'
          )"

          mapfile -t old_deployments < <(
            printf '%s\n' "${deployment_rows}" |
              sort -r |
              cut -f2 |
              tail -n +2
          )

          if ((${#old_deployments[@]} == 0)); then
            echo "No previous Pages deployments to delete"
          fi

          for deployment_id in "${old_deployments[@]}"; do
            echo "Deleting previous Pages deployment ${deployment_id}"
            gh api --method POST \
              "repos/${REPOSITORY}/deployments/${deployment_id}/statuses" \
              -f state=inactive
            gh api --method DELETE "repos/${REPOSITORY}/deployments/${deployment_id}"
          done
