name: Production preview tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run build:test-preview
      - run: npm run lint
      - run: npm run test:units
      - run: xvfb-run -a npm run test:production
